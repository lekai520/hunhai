<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勋海斗技数据表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
body{padding:16px;max-width:1200px;margin:0 auto;background:#f6f7f9;}
.top-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
#searchInput{flex:1;min-width:220px;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;}
.tab-btn{padding:10px 16px;border:none;border-radius:8px;background:#e8edf6;color:#222;cursor:pointer;font-size:14px;}
.tab-btn.active{background:#2563eb;color:#fff;}
.tab-wrap{display:none;}
.tab-wrap.show{display:block;}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid #eee;background:#fff;}
.header-row{background:#dbeafe;font-weight:bold;}
</style>
</head>
<body>
<div class="top-bar">
  <input id="searchInput" placeholder="搜索式神/御魂/阵容..." oninput="filterTable()">
  <button class="tab-btn active" data-tab="shi" onclick="switchTab('shi')">式神</button>
  <button class="tab-btn" data-tab="zhen" onclick="switchTab('zhen')">阵容</button>
  <button class="tab-btn" data-tab="car" onclick="switchTab('car')">发车</button>
</div>

<div id="tab-shi" class="tab-wrap show">
  <div class="row header-row">
    <div>式神名称</div>
    <div>面板指标</div>
    <div>御魂</div>
  </div>
</div>
<div id="tab-zhen" class="tab-wrap">
  <div class="row header-row">
    <div>名称</div>
    <div>效果</div>
    <div></div>
  </div>
</div>
<div id="tab-car" class="tab-wrap">
  <div class="row header-row">
    <div>名称</div>
    <div>备注</div>
    <div></div>
  </div>
</div>

<script>
const AIRSCRIPT_URL = "/api";

let currentTab = "shi";
let rawShi = [], rawZhen = [], rawCar = [];

function switchTab(tab) {
  currentTab = tab;
  // 隐藏全部
  document.querySelectorAll('.tab-wrap').forEach(el=>el.classList.remove('show'));
  document.getElementById('tab-'+tab).classList.add('show');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  filterTable();
}

async function loadAllData() {
  try {
    const res = await fetch(AIRSCRIPT_URL, { method: "POST" });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    rawShi = json.shi || [];
    rawZhen = json.zhen || [];
    rawCar = json.car || [];
    filterTable();
  } catch (e) {
    alert("拉取数据失败：" + e.message);
    console.error(e);
  }
}

function filterTable() {
  const kw = document.getElementById("searchInput").value.toLowerCase().trim();
  if (currentTab === "shi") renderShi(rawShi, kw);
  else if (currentTab === "zhen") renderZhen(rawZhen, kw);
  else if (currentTab === "car") renderCar(rawCar, kw);
}

// 式神渲染
function renderShi(list, keyword) {
  const wrap = document.getElementById("tab-shi");
  // 保留表头，清空数据行
  const header = wrap.querySelector(".header-row");
  wrap.innerHTML = "";
  wrap.appendChild(header);

  list.forEach(item => {
    const name = (item["式神名称"] || "").toLowerCase();
    const panel = item["面板指标"] || "";
    const yuhun = item["御魂"] || "";
    if(keyword && !name.includes(keyword) && !panel.toLowerCase().includes(keyword) && !yuhun.toLowerCase().includes(keyword)) return;

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div>${item["式神名称"] || ""}</div>
      <div>${item["面板指标"] || ""}</div>
      <div>${item["御魂"] || ""}</div>
    `;
    wrap.appendChild(row);
  })
}

// 阵容渲染
function renderZhen(list, keyword) {
  const wrap = document.getElementById("tab-zhen");
  const header = wrap.querySelector(".header-row");
  wrap.innerHTML = "";
  wrap.appendChild(header);

  list.forEach(item => {
    const name = (item["名称"] || "").toLowerCase();
    const effect = (item["效果"] || "").toLowerCase();
    if(keyword && !name.includes(keyword) && !effect.includes(keyword)) return;

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div>${item["名称"] || ""}</div>
      <div>${item["效果"] || ""}</div>
      <div></div>
    `;
    wrap.appendChild(row);
  })
}

// 发车渲染
function renderCar(list, keyword) {
  const wrap = document.getElementById("tab-car");
  const header = wrap.querySelector(".header-row");
  wrap.innerHTML = "";
  wrap.appendChild(header);

  list.forEach(item => {
    const name = (item["名称"] || "").toLowerCase();
    const note = (item["备注"] || "").toLowerCase();
    if(keyword && !name.includes(keyword) && !note.includes(keyword)) return;

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div>${item["名称"] || ""}</div>
      <div>${item["备注"] || ""}</div>
      <div></div>
    `;
    wrap.appendChild(row);
  })
}

// 页面加载自动拉取
window.onload = loadAllData;
</script>
</body>
</html>
